<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#627a67"/>
      <stop offset=".52" stop-color="#3f5d4c"/>
      <stop offset="1" stop-color="#30483e"/>
    </linearGradient>
    <filter id="shadow" x="-35%" y="-25%" width="180%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
      <feOffset dx="12" dy="19" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="260" cy="260" r="220" fill="#eae5d7"/>
  <circle cx="405" cy="105" r="58" fill="#d8ad82" opacity=".88"/>
  <g fill="#cb9066" font-family="Georgia,serif" text-anchor="middle">
    <text x="92" y="137" font-size="27">✳</text>
    <text x="456" y="400" font-size="19">✳</text>
  </g>
  <g filter="url(#shadow)" transform="rotate(-4 260 245)">
    <rect x="142" y="77" width="236" height="340" fill="url(#cover)"/>
    <path d="M145 80v334" fill="none" stroke="#fff5dc" stroke-opacity=".19" stroke-width="3"/>
    <text x="260" y="108" fill="#fff5dc" font-family="Arial,sans-serif" font-size="9" letter-spacing="3" text-anchor="middle">A NOVEL</text>
    <text x="165" y="181" fill="#fff5dc" font-family="Georgia,serif" font-size="48" letter-spacing="-2">The</text>
    <text x="165" y="226" fill="#fff5dc" font-family="Georgia,serif" font-size="48" letter-spacing="-2">Light</text>
    <text x="165" y="263" fill="#fff5dc" font-family="Georgia,serif" font-size="38" letter-spacing="-1">We Keep</text>
    <g fill="none" stroke="#f5dcae">
      <circle cx="260" cy="370" r="111" stroke-opacity=".57"/>
      <circle cx="260" cy="370" r="128" stroke-opacity=".08" stroke-width="17"/>
      <circle cx="260" cy="370" r="145" stroke-opacity=".07" stroke-width="17"/>
      <circle cx="260" cy="370" r="162" stroke-opacity=".06" stroke-width="17"/>
      <circle cx="325" cy="343" r="23" stroke-opacity=".85"/>
    </g>
    <text x="260" y="397" fill="#fff5dc" font-family="Arial,sans-serif" font-size="8" letter-spacing="2.5" text-anchor="middle">VIEWDENLIFE</text>
  </g>
  <text x="99" y="474" fill="#6e746a" font-family="Georgia,serif" font-size="15" font-style="italic">A story to return to.</text>
</svg>
